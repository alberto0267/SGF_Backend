services:
  db:
    image: mysql:8.0
    container_name: diapp-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: diapp
      MYSQL_USER: diapp
      MYSQL_PASSWORD: diapp
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
